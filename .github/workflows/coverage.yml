name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang llvm libc++-dev libc++abi-dev \
            libomp-dev libeigen3-dev ninja-build

      - name: Configure
        run: |
          cmake --fresh -S . -B build-coverage -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS="-stdlib=libc++" \
            -DCMAKE_BUILD_TYPE=Release \
            -DQPP_ENABLE_COVERAGE=ON \
            -DQPP_ENABLE_SANITIZE=OFF \
            -DQPP_ENABLE_MATLAB=OFF \
            -DQPP_ENABLE_OPENMP=OFF

      - name: Generate coverage
        run: cmake --build build-coverage --target coverage --parallel 2

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build-coverage/coverage/coverage-public.info
          disable_search: true
          fail_ci_if_error: true
