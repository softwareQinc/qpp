name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  BUILD_TYPE: Debug

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Configure Quantum++
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DQPP_ENABLE_TESTING=ON
        shell: bash

      - name: Install Quantum++
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            cmake --install build --config ${{ env.BUILD_TYPE }}
          else
            sudo cmake --install build --config ${{ env.BUILD_TYPE }}
          fi

      - name: Configure standalone example
        run: cmake -S examples/standalone -B examples/standalone/build

      - name: Build standalone example
        run: cmake --build examples/standalone/build --config ${{ env.BUILD_TYPE }} --target standalone

      - name: Run standalone example
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            ./examples/standalone/build/${{ env.BUILD_TYPE }}/standalone.exe
          else
            ./examples/standalone/build/standalone
          fi

      - name: Build examples
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --target examples

      - name: Configure benchmarks
        run: cmake -S benchmarks -B benchmarks/build

      - name: Build benchmarks
        run: cmake --build benchmarks/build --config ${{ env.BUILD_TYPE }}

      - name: Build unit tests
        run: cmake --build build/unit_tests --config ${{ env.BUILD_TYPE }} --target unit_tests --parallel 8

      - name: Run unit tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            ./build/unit_tests/unit_tests.exe \
              --gtest_filter='-qpp_Timer.*'
          else
            ./build/unit_tests/unit_tests \
              --gtest_filter='-qpp_Timer.*'
          fi

      - name: Uninstall Quantum++
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            cmake --build build --config ${{ env.BUILD_TYPE }} --target uninstall
          else
            sudo cmake --build build --config ${{ env.BUILD_TYPE }} --target uninstall
          fi

      - name: Install pyqpp and test import
        shell: bash
        run: |
          # Windows has issues with virtual environment detection in CMake
          if [ "$RUNNER_OS" != "Windows" ]; then
            python3 -m venv venv
            source venv/bin/activate
          fi
          python -m pip install -e .
          python -c "import pyqpp; print(pyqpp.dirac(pyqpp.states.zero()))"
